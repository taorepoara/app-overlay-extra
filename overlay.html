<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Overlay</title>
	<script type="module" src="/src/client/overlay.ts"></script>
</head>
<body>
	<header>
			<h1>Lenra</h1>
			<p>Chaque soutien apporté à la chaîne nous permet de financer nos projets open source. Retrouvez les sur <a href="http://github.com/lenra-io" target="_blank">github.com/lenra-io</a></p>
	</header>
	<main>
		<p class="message" data-scene="start">Le live commence bientôt</p>
		<p class="message" data-scene="pause">J'arrive tout de suite</p>
		<p class="message" data-scene="end">Merci d'être passé !</p>
		<div id="transition-logo-container"></div>
		<video id="camera" autoplay playsinline></video>
		<video id="screen" autoplay playsinline></video>
	</main>
	<footer>
			<ul>
					<li class="viewers">
							<output id="viewerCount">...</output> viewers
					</li>
					<li class="followers">
							<output id="followerCount">...</output> follower<output id="latestFollower" class="last">...</output>
					</li>
					<li class="subscriber">
							<output id="subscriberCount">...</output> suscribers<output id="latestSubscriber" class="last">...</output>
					</li>
					<li class="stars">
							<output id="starsCount">...</output> GitHub stargazers<output id="latestStargazer" class="last">...</output>
					</li>
			</ul>
	</footer>
</body>
</html>
