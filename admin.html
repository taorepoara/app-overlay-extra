<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin</title>
	<script type="module" src="/src/client/admin.ts"></script>
</head>

<body>
	<main>
		<h1>Admin Page</h1>
		<header>
			<label for="scene">Scene:</label>
			<select id="scene"></select>
			<div id="music-sync">
				<span id="music-countdown"></span>
				<button id="cancel-transition" hidden>Annuler</button>
			</div>
			<label for="hide-interface"><input type="checkbox" id="hide-interface">Hide interface</label>
			<!-- <button class="refresh-css">Rafraichir le CSS</button>
			<button class="refresh">Rafraichir tout</button> -->
		</header>
		<details id="share" open>
			<summary>Share content</summary>
			<dialog id="add-camera">
				<form method="dialog">
					<select id="camera-select"></select>
					<select id="mic-select"></select>
					<input type="submit" value="Valider">
				</form>
				<video id="camera-selected" autoplay muted></video>
			</dialog>
			<ul>
				<li>
					<h3>Camera</h3>
					<video id="camera" autoplay muted></video>
					<button id="open-add-camera">Choose camera & mic</button>
				</li>
				<li>
					<h3>Screen</h3>
					<video id="screen" autoplay muted></video>
					<button id="share-screen">Screen share</button>
				</li>
			</ul>
		</details>
		<details id="sound" open>
			<summary>Sound</summary>
			<ul id="tracks"></ul>
			<label for="mute-mic"><input type="checkbox" id="mute-mic">Mute microphone</label>
			<label for="mute-music"><input type="checkbox" id="mute-music">Mute music</label>
		</details>
		<details id="twitch" open>
			<summary>Twitch</summary>
			<section id="upcoming-stream" hidden>
				<h2>Prochain live</h2>
				<p>Titre: <strong id="next-stream-title"></strong></p>
				<p><strong id="next-stream-date"></strong></p>
				<p>Catégorie: <strong id="next-stream-category"></strong></p>
				<p>Tags: <strong id="next-stream-tags"></strong></p>
			</section>
			<form id="stream-info-form" hidden>
				<p>Aucun live planifié — configurez les informations de diffusion:</p>
				<label>
					Titre
					<input type="text" id="stream-title" placeholder="Titre du live" required>
				</label>
				<label>
					Catégorie
					<input type="text" id="stream-game" placeholder="Nom de la catégorie" required>
				</label>
				<label>
					Tags <small>(séparés par des virgules)</small>
					<input type="text" id="stream-tags" placeholder="ex: français, programmation">
				</label>
				<label>
					Date et heure du live
					<input type="datetime-local" id="stream-start-date" required>
				</label>
				<label>
					Date et heure de fin (prévue) du live
					<input type="datetime-local" id="stream-end-date" required>
				</label>
				<button type="submit">Créer et appliquer</button>
			</form>
			<p id="stream-info-status" hidden></p>
		</details>
	</main>
</body>

</html>
